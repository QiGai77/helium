name: Android CI

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloud/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Worker tests
        run: node --experimental-strip-types --test test/*.test.ts

  # M7: 主流程 Compose UI 测试跑在模拟器上。GitHub-hosted ubuntu runner 带 KVM，
  # reactivecircus/android-emulator-runner 是官方文档里最常用的方案，可行；
  # 但本机沙盒无 KVM/无模拟器，未实跑过——首次跑若 flaky，先看本 job 的报告。
  ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports-${{ github.sha }}
          path: app/build/reports/androidTests/
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional repository secrets for a private release key. Without them the public keystore in
      # /keystore is used, so every CI build has the same signature and installs over the previous one.
      HELIUM_KEYSTORE_BASE64: ${{ secrets.HELIUM_KEYSTORE_BASE64 }}
      HELIUM_KEYSTORE_PASSWORD: ${{ secrets.HELIUM_KEYSTORE_PASSWORD }}
      HELIUM_KEY_ALIAS: ${{ secrets.HELIUM_KEY_ALIAS }}
      HELIUM_KEY_PASSWORD: ${{ secrets.HELIUM_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode private keystore (optional)
        if: env.HELIUM_KEYSTORE_BASE64 != ''
        run: |
          echo "$HELIUM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/helium-release.jks"
          echo "HELIUM_KEYSTORE_PATH=$RUNNER_TEMP/helium-release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          mkdir -p dist
          cp "$APK" dist/helium.apk
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs dist/helium.apk || true
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: helium-apk-${{ github.sha }}
          path: dist/helium.apk
          if-no-files-found: error

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas-${{ github.sha }}
          path: app/schemas/
          if-no-files-found: warn

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/helium.apk
          generate_release_notes: true
